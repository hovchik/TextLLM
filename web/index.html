<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text LLM Studio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237c5cff'/><path d='M9 11h14M9 16h10M9 21h12' stroke='white' stroke-width='2.5' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div id="auth-root"></div>
<div class="shell" id="shell" hidden>
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 32 32"><path d="M9 11h14M9 16h10M9 21h12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></div>
      <div><div class="brand-name">Text LLM</div><div class="brand-sub">Studio</div></div>
    </div>
    <nav id="nav">
      <a href="#/dashboard" data-page="dashboard" data-admin><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zm10 7h6V11h-6zM4 20h6v-4H4zm10-16v4h6V4z"/></svg><span>Dashboard</span></a>
      <a href="#/training" data-page="training" data-admin><svg viewBox="0 0 24 24"><path d="M12 3v3m0 12v3M4.2 7.5l2.6 1.5m10.4 6 2.6 1.5M4.2 16.5l2.6-1.5m10.4-6 2.6-1.5M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg><span>Training</span></a>
      <a href="#/chat" data-page="chat"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg><span>Chat</span></a>
      <a href="#/analytics" data-page="analytics" data-admin><svg viewBox="0 0 24 24"><path d="M4 20V10m6 10V4m6 16v-7m4 7H3"/></svg><span>Analytics</span></a>
      <a href="#/feedback" data-page="feedback" data-admin><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg><span>Feedback</span><b class="badge" id="nav-pending" hidden></b></a>
      <a href="#/users" data-page="users" data-admin><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg><span>Users</span></a>
      <a href="#/settings" data-page="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Settings</span></a>
    </nav>
    <div class="sidebar-foot">
      <div class="jobpill" id="jobpill" data-admin><span class="dot"></span><span class="jobtext">Idle</span></div>
      <button class="iconbtn" id="theme-toggle" title="Switch theme"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
    </div>
    <div class="userchip" id="userchip">
      <div class="avatar-sm" id="user-initial"></div>
      <div class="who"><b id="user-name"></b><span id="user-role"></span></div>
      <button class="iconbtn" id="logout" title="Sign out"><svg viewBox="0 0 24 24"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l5-5-5-5M15 12H3"/></svg></button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="toasts"></div>
<div id="modal-root"></div>
<script src="/static/charts.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
