<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text LLM Studio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237c5cff'/><path d='M9 11h14M9 16h10M9 21h12' stroke='white' stroke-width='2.5' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 32 32"><path d="M9 11h14M9 16h10M9 21h12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></div>
      <div><div class="brand-name">Text LLM</div><div class="brand-sub">Studio</div></div>
    </div>
    <nav id="nav">
      <a href="#/dashboard" data-page="dashboard"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zm10 7h6V11h-6zM4 20h6v-4H4zm10-16v4h6V4z"/></svg><span>Dashboard</span></a>
      <a href="#/training" data-page="training"><svg viewBox="0 0 24 24"><path d="M12 3v3m0 12v3M4.2 7.5l2.6 1.5m10.4 6 2.6 1.5M4.2 16.5l2.6-1.5m10.4-6 2.6-1.5M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg><span>Training</span></a>
      <a href="#/chat" data-page="chat"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg><span>Chat</span></a>
      <a href="#/analytics" data-page="analytics"><svg viewBox="0 0 24 24"><path d="M4 20V10m6 10V4m6 16v-7m4 7H3"/></svg><span>Analytics</span></a>
      <a href="#/feedback" data-page="feedback"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg><span>Feedback</span><b class="badge" id="nav-pending" hidden></b></a>
    </nav>
    <div class="sidebar-foot">
      <div class="jobpill" id="jobpill"><span class="dot"></span><span class="jobtext">Idle</span></div>
      <button class="iconbtn" id="theme-toggle" title="Switch theme"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="toasts"></div>
<div id="modal-root"></div>
<script src="/static/charts.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
